# Deliberately no npm (or any other package-manager) version-update entry here. Routine
# freshness PRs cost real integration-debugging effort disproportionate to how trivial the bump
# itself is - the risk/effort only makes sense when there's an actual reason to take it on. Real
# CVE coverage comes from GitHub's native Dependabot security updates (Settings > Code security),
# which need no config here and only open a PR when a dependency has a known vulnerability.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

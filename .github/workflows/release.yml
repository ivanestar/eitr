name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Verify & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Code Formatting Check
        run: npm run format:check

      - name: Build All Packages
        run: npm run build

      - name: Run Core & Eval Gates
        run: npx vitest run packages/engine/test/boundary.test.ts packages/cli/test/boundary.test.ts packages/cli/test/release-notes.test.ts packages/evals/test/offline-evals.test.ts

      - name: Extract Release Notes
        run: node scripts/extract-release-notes.mjs "${{ github.ref_name }}" --file release-notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file release-notes.md \
            --verify-tag

      # -------------------------------------------------------------------------
      # Upcoming step: Publish to npm registry (staged for future activation)

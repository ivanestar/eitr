name: 'CLA Assistant'
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: 'CLA Assistant'
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures/signatures.json'
          path-to-document: 'https://github.com/ivanestar/eitr/blob/main/CLA.md'
          # Signatures are stored on a dedicated, deliberately UNPROTECTED branch - the action
          # commits directly to this branch (not via a PR), which fails outright if branch
          # protection (e.g. a required status check on `main`) blocks that direct push.
          branch: 'cla-signatures'
          allowlist: bot*,dependabot[bot],renovate[bot],ivanestar

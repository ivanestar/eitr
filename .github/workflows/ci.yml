name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Code Formatting Check
        run: npm run format:check

      - name: Build All Packages
        run: npm run build

      # Runs the full engine + CLI unit/integration suite (60+ files, up from the previous
      # 3-file boundary-test-only gate). Two files remain excluded pending their own pre-existing,
      # unrelated fixes — both tracked as debt in TODO.md rather than silently skipped here (none
      # regressed by this change; both were already red on main before this workflow was widened):
      #   - terminal-e2e.test.ts: spawns the real CLI end-to-end (long real-process runtime) and
      #     has 1 pre-existing failing assertion. Run manually via `npm run test:e2e`.
      #   - contract.test.ts: 1 assertion flags 4 pre-existing `setTimeout`-based waits in the
      #     shipped runtime asset components (packages/engine/assets/runtime{,-js}), unrelated to
      #     any template touched by this change.
      # live-evals.test.ts is intentionally out of scope for both steps below: it calls live LLM
      # provider APIs, requires API key secrets, and is non-deterministic by design (see
      # npm run eval:live / eval:sonnet / etc. for on-demand live grading).
      - name: Run Full Test Suite
        run: npx vitest run packages/engine/test packages/cli/test --exclude "**/terminal-e2e.test.ts" --exclude "**/contract.test.ts"

      - name: Run Deterministic Eval Suite
        run: npm run eval
